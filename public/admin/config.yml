# Sveltia CMS 配置。字段定义与 CLAUDE.md 内容模型保持同步。
backend:
  name: github
  repo: amekuro/asanokiri-source # 内容仓库（源码）；勿写部署仓库 asanokiri（会被构建覆盖）
  branch: main

site_url: https://amekuro.github.io/asanokiri/
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: 活动文章
    label_singular: 文章
    folder: posts
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: date, label: 日期, widget: datetime, format: YYYY-MM-DD, time_format: false }
      - { name: cover, label: 封面图, widget: image, required: false }
      - { name: featured, label: 精选, widget: boolean, required: false, default: false }
      - { name: body, label: 正文, widget: markdown }

  - name: data
    label: 站点数据
    files:
      - name: site
        label: 全局信息
        file: data/site.yml
        fields:
          - { name: name, label: 社团名称, widget: string }
          - { name: name_ja, label: 日文读法（装饰用）, widget: string, required: false }
          - { name: tagline, label: 一句话标语, widget: string, required: false }
          - { name: description, label: 社团简介, widget: text, required: false }
          - name: departments
            label: 部门
            widget: list
            required: false
            fields:
              - { name: name, label: 名称, widget: string }
              - { name: text, label: 部门介绍（一段文字）, widget: text, required: false }
              - { name: image, label: 配图, widget: image, required: false }
          - name: contacts
            label: 联系方式（首页「找到我们」+ 页脚）
            widget: list
            required: false
            fields:
              - { name: name, label: 名称, widget: string }
              - { name: text, label: 展示文本, widget: string, required: false }
              - { name: link, label: 跳转链接, widget: string, required: false }
              - { name: qr_link, label: 二维码内容链接（构建时自动生成二维码）, widget: string, required: false }
              - { name: qr_image, label: 二维码图片（设置后优先于自动生成）, widget: image, required: false }
              - { name: avatar, label: 二维码中心头像, widget: image, required: false }
      - name: history
        label: 社团沿革
        file: data/history.yml
        fields:
          - name: items
            label: 沿革条目
            widget: list
            required: false
            fields:
              - { name: year, label: 年份, widget: string }
              - { name: title, label: 标题, widget: string }
              - { name: text, label: 说明, widget: text, required: false }
              - { name: image, label: 配图, widget: image, required: false }
